<header class="site-header">
    <div class="site-header__inner container">
        <div class="site-header__logo"><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></div>

        <nav class="site-header__nav nav">
            <ul class="nav__list">
                {{ range .Site.Menus.main }}
                    <li class="nav__item"><a class="nav__link" href="{{ .URL }}">{{ .Name }}</a></li>
                {{ end }}
            </ul>
        </nav>
    </div>
</header>
