<header class="site-header">
    <div class="site-header__inner container">
        <div class="site-header__logo"><a class="site-header__logo-link" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></div>

        <nav class="site-header__nav">
            <ul class="site-header__list">
                {{ range .Site.Menus.main }}
                    <li class="site-header__item"><a class="site-header__link" href="{{ .URL }}">{{ .Name }}</a></li>
                {{ end }}
            </ul>
        </nav>
    </div>
</header>
